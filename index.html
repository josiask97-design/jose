<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Josenet</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f0f2f5;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    header {
      background-color: #2e7d32;
      color: white;
      padding: 15px;
      text-align: center;
      font-size: 20px;
      font-weight: bold;
    }
    #chat-container {
      flex: 1;
      padding: 15px;
      overflow-y: auto;
    }
    .message {
      background: white;
      padding: 10px 15px;
      border-radius: 8px;
      margin-bottom: 10px;
      max-width: 80%;
      box-shadow: 0 1px 2px rgba(0,0,0,0.1);
    }
    #form {
      display: flex;
      padding: 10px;
      background: white;
      border-top: 1px solid #ccc;
    }
    #input {
      flex: 1;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 20px;
      outline: none;
    }
    button {
      background-color: #2e7d32;
      color: white;
      border: none;
      padding: 10px 18px;
      margin-left: 8px;
      border-radius: 20px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <header>Josenet</header>

  <div id="chat-container">
    <div class="message">Bienvenue sur Josenet !</div>
  </div>

  <form id="form">
    <input id="input" autocomplete="off" placeholder="Écrivez un message..." />
    <button type="submit">Envoyer</button>
  </form>

  <script>
    const socket = io();
    const form = document.getElementById('form');
    const input = document.getElementById('input');
    const chatContainer = document.getElementById('chat-container');

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      if (input.value) {
        socket.emit('send_message', { sender: 'Moi', message: input.value });
        input.value = '';
      }
    });

    socket.on('receive_message', (data) => {
      const msgDiv = document.createElement('div');
      msgDiv.classList.add('message');
      msgDiv.textContent = `${data.sender} : ${data.message}`;
      chatContainer.appendChild(msgDiv);
      chatContainer.scrollTop = chatContainer.scrollHeight;
    });
  </script>
</body>
</html>
